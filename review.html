<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5b4b9e">
<title>Design Approval</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  body{display:flex;flex-direction:column;background:linear-gradient(160deg,#667eea,#764ba2);color:#fff;
       user-select:none;-webkit-user-select:none}

  header{padding:14px 16px calc(14px + env(safe-area-inset-top)) 16px;padding-top:calc(14px + env(safe-area-inset-top));
         display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.18)}
  header .t{flex:1;min-width:0}
  header h1{font-size:17px;font-weight:600;letter-spacing:-.2px}
  header p{font-size:12px;opacity:.85;margin-top:2px}
  .icon-btn{width:40px;height:40px;border:none;border-radius:50%;background:rgba(255,255,255,.18);
            color:#fff;font-size:17px;cursor:pointer;flex:none;transition:transform .15s}
  .icon-btn:active{transform:scale(.9)}

  main{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:16px;min-height:0}

  .stack{position:relative;width:100%;max-width:420px;height:100%;max-height:620px}
  .card{position:absolute;inset:0;background:#fff;border-radius:18px;overflow:hidden;
        box-shadow:0 12px 40px rgba(0,0,0,.32);display:flex;flex-direction:column;
        touch-action:pan-y;will-change:transform}
  .card .img{flex:1;background:#f2f2f4;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
  .card .img img{width:100%;height:100%;object-fit:contain;pointer-events:none}
  .card .img .ph{position:absolute;color:#bbb;font-size:13px}
  .meta{padding:12px 14px;color:#222;border-top:1px solid #eee;background:#fff}
  .meta h2{font-size:15px;font-weight:650;line-height:1.25}
  .meta .sub{font-size:11px;color:#8a8a90;margin-top:3px}
  .meta .desc{font-size:12.5px;color:#5a5a62;margin-top:6px;line-height:1.4;
              display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .acts{display:flex;gap:7px;padding:10px 12px calc(10px + env(safe-area-inset-bottom)) 12px;background:#fff}
  .acts button{flex:1;padding:12px 6px;border:none;border-radius:10px;font-size:13px;font-weight:650;
               color:#fff;cursor:pointer;transition:transform .12s}
  .acts button:active{transform:scale(.94)}
  .no{background:#ff4757}.mid{background:#ffa502}.yes{background:#2ed573}

  .badge{position:absolute;top:20px;font-size:26px;font-weight:800;letter-spacing:1px;padding:8px 16px;
         border:4px solid;border-radius:10px;opacity:0;transition:opacity .1s;pointer-events:none}
  .badge.y{right:18px;color:#2ed573;border-color:#2ed573;transform:rotate(14deg)}
  .badge.n{left:18px;color:#ff4757;border-color:#ff4757;transform:rotate(-14deg)}

  .panel{position:absolute;inset:16px;display:none;flex-direction:column;align-items:center;
         justify-content:center;text-align:center;gap:14px}
  .panel.on{display:flex}
  .panel .em{font-size:52px}
  .panel h2{font-size:20px;font-weight:650}
  .panel p{font-size:13.5px;opacity:.9;max-width:300px;line-height:1.55}
  .panel code{background:rgba(0,0,0,.25);padding:2px 7px;border-radius:5px;font-size:12.5px}
  .ghost{background:#fff;color:#5b4b9e;border:none;padding:12px 26px;border-radius:22px;
         font-weight:650;font-size:14px;cursor:pointer}
  .ghost:active{transform:scale(.95)}
  .spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;
        border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  footer{padding:8px 16px calc(10px + env(safe-area-inset-bottom)) 16px;display:flex;
          align-items:center;justify-content:center;gap:14px;font-size:12px;font-weight:650;
          background:rgba(0,0,0,.14)}
  footer span{display:flex;align-items:center;gap:5px}

  /* results */
  .results{position:absolute;inset:0;background:#fff;color:#222;border-radius:18px;overflow-y:auto;
           padding:20px;display:none}
  .results.on{display:block}
  .results h2{font-size:19px;margin-bottom:4px}
  .results .lead{font-size:13px;color:#777;margin-bottom:16px}
  .grp{margin-bottom:16px}
  .grp h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:#999;margin-bottom:7px}
  .row{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border-radius:9px;
       background:#f7f7f9;margin-bottom:6px;font-size:13px;line-height:1.4}
  .row .n{font-weight:600}
  .row .c{color:#666;font-size:12px;margin-top:3px;white-space:pre-wrap}
  .results .send{display:flex;gap:8px;margin-top:8px}
  .results .send button{flex:1;padding:13px;border:none;border-radius:10px;font-weight:650;
                        font-size:13.5px;color:#fff;cursor:pointer}
  .wa{background:#25d366}.cp{background:#5b4b9e}
  .again{width:100%;margin-top:8px;padding:12px;border:none;border-radius:10px;background:#eee;
         color:#555;font-weight:650;font-size:13px;cursor:pointer}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;display:none;align-items:flex-end}
  .modal.on{display:flex}
  .sheet{background:#fff;color:#222;width:100%;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom)) 18px;max-height:88vh;overflow-y:auto}
  .sheet h3{font-size:16px;margin-bottom:14px}
  .sheet label{display:block;font-size:12px;font-weight:650;margin-bottom:6px;color:#444}
  .sheet textarea,.sheet select{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;
                                font-size:15px;font-family:inherit;margin-bottom:14px;
                                -webkit-user-select:text;user-select:text}
  .sheet textarea{min-height:100px;resize:vertical}
  .sheet textarea:focus,.sheet select:focus{outline:none;border-color:#667eea}
  .sheet .btns{display:flex;gap:9px}
  .sheet .btns button{flex:1;padding:13px;border:none;border-radius:10px;font-weight:650;font-size:14px;cursor:pointer}
  .cancel{background:#f0f0f2;color:#444}.save{background:#ffa502;color:#fff}
</style>
</head>
<body>

<header>
  <div class="t">
    <h1>🎨 Design Approval</h1>
    <p id="hp">Loading…</p>
  </div>
  <button class="icon-btn" id="refresh" title="Check for new designs">🔄</button>
</header>

<main>
  <div class="stack" id="stack"></div>

  <div class="panel on" id="pLoad"><div class="spin"></div><p>Loading designs…</p></div>

  <div class="panel" id="pEmpty">
    <div class="em">📭</div>
    <h2>No designs yet</h2>
    <p>Nothing has been uploaded for review. Tap refresh once the designer has added the designs.</p>
    <button class="ghost" onclick="load()">🔄 Check again</button>
  </div>

  <div class="panel" id="pErr">
    <div class="em">📡</div>
    <h2>Couldn't load</h2>
    <p id="errMsg">Check your connection and try again.</p>
    <button class="ghost" onclick="load()">🔄 Retry</button>
  </div>

  <div class="results" id="results"></div>
</main>

<footer id="foot" style="display:none">
  <span style="color:#7bffb0">✅ <b id="cY">0</b></span>
  <span style="color:#ff9aa2">❌ <b id="cN">0</b></span>
  <span style="color:#ffd48a">💬 <b id="cC">0</b></span>
  <span style="opacity:.7" id="prog"></span>
</footer>

<div class="modal" id="modal">
  <div class="sheet">
    <h3 id="mTitle">Add feedback</h3>
    <label>Your comments</label>
    <textarea id="mText" placeholder="What needs to change?"></textarea>
    <label>Suggested action</label>
    <select id="mAction">
      <option value="Needs revision">Needs revision</option>
      <option value="Approved with changes">Approved with changes</option>
      <option value="Discuss on call">Discuss on call</option>
      <option value="Rejected">Rejected</option>
    </select>
    <div class="btns">
      <button class="cancel" onclick="closeModal()">Cancel</button>
      <button class="save" onclick="saveNote()">Save &amp; next</button>
    </div>
  </div>
</div>

<script>
/* ---------------------------------------------------------------
   Reads designs straight out of the public GitHub repo.
   No sign-in, no API key, no setup for whoever opens this page.
   Designer adds images to the designs/ folder -> they show up here.
----------------------------------------------------------------*/
const REPO   = 'rabin-webook/national-day-designs';
const FOLDER = 'designs';
const API    = `https://api.github.com/repos/${REPO}/contents/${FOLDER}`;
const IMG_RE = /\.(png|jpe?g|webp|gif|avif)$/i;
const STORE  = 'wb_review_v1';

let designs = [], i = 0, decisions = {}, card = null;
let x0 = 0, dx = 0, dragging = false;

/* ---------- data ---------- */
async function load(){
  show('pLoad'); document.getElementById('foot').style.display='none';
  try{
    const r = await fetch(API, {cache:'no-store'});
    if(r.status === 404){ return show('pEmpty'); }
    if(r.status === 403){ return fail('GitHub is rate-limiting this connection. Wait a minute and retry.'); }
    if(!r.ok) return fail('GitHub returned ' + r.status + '.');

    const files = await r.json();
    if(!Array.isArray(files)) return show('pEmpty');

    const manifest = await loadManifest(files);
    designs = files
      .filter(f => f.type === 'file' && IMG_RE.test(f.name))
      .sort((a,b) => a.name.localeCompare(b.name, undefined, {numeric:true}))
      .map(f => {
        const m = manifest[f.name] || {};
        return {
          key  : f.sha,
          url  : f.download_url,
          title: m.title || prettify(f.name),
          desc : m.description || '',
          type : m.type || ''
        };
      });

    if(!designs.length) return show('pEmpty');

    decisions = restore();
    i = designs.findIndex(d => !decisions[d.key]);
    if(i < 0) i = designs.length;
    render();
  }catch(e){
    fail('No connection to GitHub. Check your internet and retry.');
  }
}

async function loadManifest(files){
  if(!files.some(f => f.name === 'manifest.json')) return {};
  try{
    const f = files.find(f => f.name === 'manifest.json');
    const j = await (await fetch(f.download_url, {cache:'no-store'})).json();
    return (j && typeof j === 'object') ? j : {};
  }catch(e){ return {}; }
}

function prettify(name){
  return name.replace(IMG_RE,'').replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim()
             .replace(/\b\w/g, c => c.toUpperCase());
}

/* ---------- persistence (this reviewer's own progress) ---------- */
function restore(){ try{ return JSON.parse(localStorage.getItem(STORE)) || {}; }catch(e){ return {}; } }
function persist(){ try{ localStorage.setItem(STORE, JSON.stringify(decisions)); }catch(e){} }

/* ---------- rendering ---------- */
function show(id){
  ['pLoad','pEmpty','pErr'].forEach(p => document.getElementById(p).classList.toggle('on', p===id));
  document.getElementById('results').classList.remove('on');
  if(id) document.getElementById('stack').innerHTML = '';
  document.getElementById('hp').textContent =
    id==='pLoad' ? 'Loading…' : id==='pEmpty' ? 'Waiting for designs' : id==='pErr' ? 'Offline' : '';
}
function fail(msg){ document.getElementById('errMsg').textContent = msg; show('pErr'); }

function render(){
  show(null);
  const stack = document.getElementById('stack');
  stack.innerHTML = '';

  if(i >= designs.length){ return summary(); }

  document.getElementById('foot').style.display = 'flex';
  document.getElementById('hp').textContent = 'Swipe or tap • ' + designs.length + ' design' + (designs.length>1?'s':'');

  for(let k = Math.min(2, designs.length - i - 1); k >= 0; k--){
    const d = designs[i+k];
    const el = document.createElement('div');
    el.className = 'card';
    el.style.zIndex = 10 - k;
    el.style.transform = `translateY(${k*7}px) scale(${1 - k*.025})`;
    el.innerHTML =
      `<div class="img"><span class="ph">Loading image…</span>
         <img src="${d.url}" alt="" onload="this.previousElementSibling.remove()"
              onerror="this.previousElementSibling.textContent='Image unavailable'">
       </div>
       <div class="badge y">APPROVE</div><div class="badge n">REJECT</div>
       <div class="meta">
         <h2></h2>
         <div class="sub"></div>
         ${d.desc ? '<div class="desc"></div>' : ''}
       </div>
       <div class="acts">
         <button class="no">❌ Reject</button>
         <button class="mid">💬 Comment</button>
         <button class="yes">✅ Approve</button>
       </div>`;
    el.querySelector('.meta h2').textContent = d.title;
    el.querySelector('.meta .sub').textContent = (d.type ? d.type + ' • ' : '') + 'Design ' + (i+k+1) + ' of ' + designs.length;
    if(d.desc) el.querySelector('.meta .desc').textContent = d.desc;
    el.querySelector('.no').onclick  = e => { e.stopPropagation(); decide('rejected'); };
    el.querySelector('.yes').onclick = e => { e.stopPropagation(); decide('approved'); };
    el.querySelector('.mid').onclick = e => { e.stopPropagation(); openModal(); };
    stack.appendChild(el);
    if(k === 0){ card = el; attachDrag(el); }
  }
  counts();
}

function counts(){
  const v = Object.values(decisions);
  document.getElementById('cY').textContent = v.filter(d => d.verdict==='approved').length;
  document.getElementById('cN').textContent = v.filter(d => d.verdict==='rejected').length;
  document.getElementById('cC').textContent = v.filter(d => d.note).length;
  document.getElementById('prog').textContent = Math.min(i+1, designs.length) + '/' + designs.length;
}

/* ---------- swipe ---------- */
function attachDrag(el){
  el.addEventListener('touchstart', down, {passive:true});
  el.addEventListener('mousedown', down);
}
function down(e){
  if(e.target.closest('.acts')) return;
  dragging = true; dx = 0;
  x0 = e.touches ? e.touches[0].clientX : e.clientX;
  card.style.transition = 'none';
  document.addEventListener('touchmove', move, {passive:false});
  document.addEventListener('touchend', up);
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}
function move(e){
  if(!dragging) return;
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  dx = x - x0;
  if(e.cancelable && Math.abs(dx) > 8) e.preventDefault();
  card.style.transform = `translateX(${dx}px) rotate(${dx/18}deg)`;
  card.querySelector('.badge.y').style.opacity = dx > 25 ? Math.min(1, dx/110) : 0;
  card.querySelector('.badge.n').style.opacity = dx < -25 ? Math.min(1, -dx/110) : 0;
}
function up(){
  if(!dragging) return;
  dragging = false;
  document.removeEventListener('touchmove', move);
  document.removeEventListener('touchend', up);
  document.removeEventListener('mousemove', move);
  document.removeEventListener('mouseup', up);
  card.style.transition = 'transform .28s ease-out, opacity .28s ease-out';
  if(dx > 100)      fly(1, 'approved');
  else if(dx < -100) fly(-1, 'rejected');
  else{
    card.style.transform = '';
    card.querySelectorAll('.badge').forEach(b => b.style.opacity = 0);
  }
  dx = 0;
}
function fly(dir, verdict){
  card.style.transform = `translateX(${dir*window.innerWidth*1.3}px) rotate(${dir*28}deg)`;
  card.style.opacity = 0;
  setTimeout(() => decide(verdict), 190);
}

/* ---------- decisions ---------- */
function decide(verdict, note, action){
  const d = designs[i];
  if(!d) return;
  decisions[d.key] = {title:d.title, verdict:verdict, note:note||'', action:action||''};
  persist();
  i++;
  render();
}

function openModal(){
  document.getElementById('mTitle').textContent = designs[i].title;
  document.getElementById('mText').value = '';
  document.getElementById('modal').classList.add('on');
  setTimeout(() => document.getElementById('mText').focus(), 120);
}
function closeModal(){ document.getElementById('modal').classList.remove('on'); }
function saveNote(){
  const t = document.getElementById('mText').value.trim();
  if(!t){ document.getElementById('mText').focus(); return; }
  const a = document.getElementById('mAction').value;
  closeModal();
  decide(a === 'Rejected' ? 'rejected' : 'commented', t, a);
}

/* ---------- summary ---------- */
function summary(){
  document.getElementById('foot').style.display = 'none';
  document.getElementById('hp').textContent = 'Review complete';
  const list = designs.map(d => Object.assign({title:d.title}, decisions[d.key] || {})).filter(d => d.verdict);
  const yes  = list.filter(d => d.verdict === 'approved' && !d.note);
  const no   = list.filter(d => d.verdict === 'rejected');
  const note = list.filter(d => d.note);

  const grp = (label, arr, showNote) => !arr.length ? '' :
    `<div class="grp"><h3>${label} (${arr.length})</h3>` +
    arr.map(d => `<div class="row"><div><div class="n">${esc(d.title)}</div>` +
      (showNote && d.note ? `<div class="c">${esc(d.action ? d.action + ' — ' : '')}${esc(d.note)}</div>` : '') +
      `</div></div>`).join('') + `</div>`;

  const r = document.getElementById('results');
  r.innerHTML =
    `<h2>✅ All ${designs.length} reviewed</h2>
     <p class="lead">${yes.length} approved · ${no.length} rejected · ${note.length} with comments</p>
     ${grp('Approved', yes, false)}${grp('Rejected', no, true)}${grp('Comments', note, true)}
     <div class="send">
       <button class="wa" id="bWa">💬 Send on WhatsApp</button>
       <button class="cp" id="bCp">📋 Copy</button>
     </div>
     <button class="again" id="bAgain">↩︎ Review again from the start</button>`;
  r.classList.add('on');

  const text = buildText(yes, no, note);
  document.getElementById('bWa').onclick = () =>
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
  document.getElementById('bCp').onclick = e => {
    navigator.clipboard.writeText(text)
      .then(() => { e.target.textContent = '✓ Copied'; setTimeout(() => e.target.textContent = '📋 Copy', 1600); })
      .catch(() => {});
  };
  document.getElementById('bAgain').onclick = () => { decisions = {}; persist(); i = 0; render(); };
}

function buildText(yes, no, note){
  let t = 'Design review — ' + new Date().toLocaleDateString() + '\n\n';
  if(yes.length)  t += 'APPROVED\n' + yes.map(d => '• ' + d.title).join('\n') + '\n\n';
  if(no.length)   t += 'REJECTED\n' + no.map(d => '• ' + d.title + (d.note ? ' — ' + d.note : '')).join('\n') + '\n\n';
  if(note.length) t += 'COMMENTS\n' + note.map(d => '• ' + d.title + ' (' + d.action + ') — ' + d.note).join('\n') + '\n';
  return t.trim();
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- boot ---------- */
document.getElementById('refresh').onclick = load;
document.getElementById('modal').onclick = e => { if(e.target.id === 'modal') closeModal(); };
load();
/* Unauthenticated GitHub API allows 60 calls/hour per IP, so poll gently. */
setInterval(() => { if(i >= designs.length || !designs.length) load(); }, 180000);
</script>
</body>
</html>
